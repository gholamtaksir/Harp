name: Release

# Pushing a tag such as v0.0.1 builds everything and publishes a GitHub
# release. Running the workflow by hand builds everything without publishing;
# the files are attached to the run.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api
  WAILS_VERSION: v3.1.0

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Fetch Go version
        run: |
          echo "go_version=$(grep -oE 'golang:[0-9.]+' Dockerfile | head -n1 | cut -d: -f2)" >> "$GITHUB_ENV"

      - name: Setup Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.go_version }}

      - name: Test
        run: make test

  cli:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch Go version
        run: |
          echo "go_version=$(grep -oE 'golang:[0-9.]+' Dockerfile | head -n1 | cut -d: -f2)" >> "$GITHUB_ENV"

      - name: Setup Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.go_version }}

      - name: Build command line binaries
        uses: goreleaser/goreleaser-action@v7.2.3
        with:
          version: "~> v2"
          args: release --clean --skip=publish ${{ startsWith(github.ref, 'refs/tags/v') && ' ' || '--snapshot' }}
        env:
          GORELEASER_CURRENT_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Collect binaries
        # With the binary archive format GoReleaser leaves each binary in its
        # build folder; artifacts.json maps it to its release file name.
        run: |
          mkdir out
          jq -r '.[] | select((.name | startswith("harp_")) and .type != "Checksum") | [.path, .name] | @tsv' dist/artifacts.json |
            while IFS=$'\t' read -r path name; do
              cp "$path" "out/$name"
            done
          ls -la out
          test -n "$(ls out)"

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: cli
          path: out/*
          if-no-files-found: error

  gui:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Fetch versions
        run: |
          echo "go_version=$(grep -oE 'golang:[0-9.]+' Dockerfile | head -n1 | cut -d: -f2)" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Setup Go environment
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.go_version }}
          cache-dependency-path: |
            go.sum
            gui/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        working-directory: gui
        run: |
          wails3 build EXTRA_TAGS="$TAGS" VERSION="$VERSION"
          mkdir -p ../out
          pwsh -NoProfile -Command "Compress-Archive -Path bin/harp-gui.exe -DestinationPath ../out/Harp-${VERSION}-windows-amd64.zip"

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        working-directory: gui
        run: |
          # Native arm64 build; this also prepares the frontend, bindings and icons.
          wails3 build EXTRA_TAGS="$TAGS" VERSION="$VERSION"
          mv bin/harp-gui bin/harp-gui-arm64
          # Intel build with the same flags. Task does not pass ARCH from the
          # command line through to GOARCH, so go build is called directly.
          CGO_ENABLED=1 GOOS=darwin GOARCH=amd64 CGO_CFLAGS="-mmacosx-version-min=12.0" CGO_LDFLAGS="-mmacosx-version-min=12.0" MACOSX_DEPLOYMENT_TARGET=12.0 go build -tags "production,$TAGS" -trimpath -buildvcs=false -ldflags="-w -s -X main.Version=$VERSION" -o bin/harp-gui-amd64 .
          lipo -create -output bin/harp-gui bin/harp-gui-amd64 bin/harp-gui-arm64
          lipo -archs bin/harp-gui | grep -q x86_64
          lipo -archs bin/harp-gui | grep -q arm64
          rm bin/harp-gui-amd64 bin/harp-gui-arm64
          wails3 task darwin:create:app:bundle
          mv bin/harp-gui.app bin/Harp.app
          mkdir -p ../out
          ditto -c -k --keepParent bin/Harp.app "../out/Harp-${VERSION}-macos-universal.zip"

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        working-directory: gui
        run: |
          wails3 build EXTRA_TAGS="$TAGS" VERSION="$VERSION"
          wails3 task linux:generate:dotdesktop
          sed -i "s/^version: .*/version: \"${VERSION}\"/" build/linux/nfpm/nfpm.yaml
          GOARCH=amd64 wails3 task linux:generate:deb
          mkdir -p ../out
          tar -czf "../out/Harp-${VERSION}-linux-amd64.tar.gz" -C bin harp-gui
          cp bin/*.deb "../out/Harp-${VERSION}-linux-amd64.deb"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: gui-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [cli, gui]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download files
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Harp ${{ github.ref_name }}
          body_path: .github/release-notes.md
          files: assets/*
          make_latest: true
