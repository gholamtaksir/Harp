version: 2

project_name: harp

builds:
  - binary: harp
    env:
      - CGO_ENABLED=0
    # Keep in sync with TAGS in the Makefile.
    tags:
      - with_gvisor
      - with_quic
      - with_wireguard
      - with_utls
      - with_clash_api
    ldflags:
      - -s -w -buildid= -X github.com/gholamtaksir/Harp/cmd.Version={{ .Version }}
    flags:
      - -trimpath
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - "386"
      - amd64
      - arm
      - arm64
      - mips
      - mipsle
      - mips64
      - mips64le
      - riscv64
    goarm:
      - "6"
      - "7"
    gomips:
      - softfloat
    ignore:
      - goos: windows
        goarch: arm
      - goos: freebsd
        goarch: arm
      - goos: freebsd
        goarch: riscv64

archives:
  - formats: [binary]
    name_template: >-
      harp_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}{{ with .Mips }}_{{ . }}{{ end }}

checksum:
  name_template: "harp_{{ .Version }}_checksums.txt"

changelog:
  # The history before Harp belongs to wgcf; release notes are written by hand.
  disable: true

release:
  name_template: "Harp {{ .Version }}"
  mode: keep-existing
